name: "APTron - Disposable Staging With Recorded Exceptions"
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aptron-disposable-staging-${{ github.ref }}
  cancel-in-progress: false
jobs:
  single-host-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Source and policy regressions
        run: |
          python -m pip install PyYAML==6.0.2
          python scripts/ci/policy.py
          python -m unittest discover -s tests -v
          docker info > /dev/null
          test -z "$(git status --porcelain)"
      - name: Prepare locked scanners and isolated browser tooling
        run: |
          python scripts/ci/install_scanners.py "$RUNNER_TEMP/sh02-scanners"
          npm install --prefix "$RUNNER_TEMP/sh02-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/sh02-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/sh02-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Build and scan exact SH-02 images without publication
        run: |
          python - <<'PY'
          import os,pathlib,subprocess,sys
          sys.path.insert(0,'scripts/ci')
          from image_coverage import contract,bind
          from scan_image import scan
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          roles={'backend-runtime','backend-migration','production-frontend','postgres'}
          for row in contract():
              if row['role'] not in roles:
                  continue
              role=row['role']
              image='aptron-sh02-'+role+':local'
              iid=root/('sh02-'+role+'.id')
              args=['docker','build','--iidfile',str(iid),'--secret',
                    'id=proxy_ca,src=/etc/ssl/certs/ca-certificates.crt',
                    '-f',row['file'],'-t',image]
              if row.get('target'):
                  args+=['--target',row['target']]
              subprocess.run([*args,row['context']],check=True)
              output=root/'sh02-images'/('image-evidence-'+role)
              bind(role,image,iid,output)
              os.environ['ROLE']=role
              scan(image,output,root/'sh02-scanners')
          PY
      - name: Exercise actual three-container topology with current exceptions
        run: |
          python scripts/staging/single_host_acceptance.py \
            --image-evidence "$RUNNER_TEMP/sh02-images" \
            --evidence "$RUNNER_TEMP/sh02-acceptance"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aptron-sh02-runtime-evidence
          path: |
            ${{ runner.temp }}/sh02-images
            !${{ runner.temp }}/sh02-images/**/grype-cache/**
            ${{ runner.temp }}/sh02-acceptance
          if-no-files-found: warn
  disposable-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Secret detection remains blocking
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve scanner evidence outside the immutable source checkout
        run: |
          mkdir -p "$RUNNER_TEMP/staging-validation"
          test -f results.sarif
          mv -- results.sarif "$RUNNER_TEMP/staging-validation/secret-scan.sarif"
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Required policy and functional source checks
        run: |
          python -m pip install PyYAML==6.0.2
          python scripts/ci/policy.py
          python -m unittest discover -s tests -v
          npm ci --prefix frontend --no-audit --no-fund
          npm test --prefix frontend
          npm run lint --prefix frontend
          npm run build --prefix frontend
      - name: Validate single-host candidate structure without deployment
        run: python scripts/ci/check_single_host_compose.py
      - name: Prepare locked scanners and browser
        run: |
          python scripts/ci/install_scanners.py "$RUNNER_TEMP/staging-scanners"
          npm install --prefix "$RUNNER_TEMP/staging-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/staging-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/staging-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Build and scan the exact local staging images without publication
        run: |
          python - <<'PY'
          import os,pathlib,subprocess,sys
          sys.path.insert(0,'scripts/ci')
          from image_coverage import contract,bind
          from scan_image import scan
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          for row in contract():
              role=row['role']
              if role not in {'uat-backend','frontend','postgres'}:
                  continue
              image='aptron-disposable-staging-'+role+':local'
              iid=root/(role+'.id')
              subprocess.run(['docker','build','--iidfile',str(iid),
                              '--secret','id=proxy_ca,src=/etc/ssl/certs/ca-certificates.crt',
                              '-f',row['file'],'-t',image,row['context']],check=True)
              evidence=root/'staging-images'/('image-evidence-'+role)
              bind(role,image,iid,evidence)
              os.environ['ROLE']=role
              scan(image,evidence,root/'staging-scanners')
          PY
      - name: Apply only approved unexpired staging exceptions
        run: |
          python scripts/ci/staging_image_gate.py \
            --directory "$RUNNER_TEMP/staging-images" --source "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/staging-images/staging-decision.json"
      - name: Deploy isolated synthetic staging, test functionality, and clean up
        run: |
          python scripts/staging/run_disposable.py \
            --decision "$RUNNER_TEMP/staging-images/staging-decision.json" \
            --evidence "$RUNNER_TEMP/staging-validation"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aptron-disposable-staging-evidence
          path: |
            ${{ runner.temp }}/staging-images
            !${{ runner.temp }}/staging-images/**/grype-cache/**
            ${{ runner.temp }}/staging-validation
          if-no-files-found: warn
